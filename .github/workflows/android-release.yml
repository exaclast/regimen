name: Android CI & Signed Release

# Changes that can't affect the build or tests don't need a CI run.
# (Path filters are not applied to tag pushes, so releases always build.)
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".claude/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-debug:
    name: Unit Tests & Debug APK
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Run Unit Tests, Lint & Assemble Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: regimen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-and-release:
    name: Signed Release APK, AAB & GitHub Release
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Compute Version Metadata
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VER_NAME="${RAW_TAG#v}"
          else
            VER_NAME="${INPUT_VERSION_NAME:-1.0.0}"
            RAW_TAG="v${VER_NAME}"
          fi
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode Signing Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is required for release builds but is not set."
            exit 1
          fi
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Run Unit Tests, Lint & Build Release Artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'regimen' }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          VER="${{ steps.version.outputs.version_name }}"
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::Signed release APK app-release.apk not found."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/regimen-${VER}.apk"
          if [ ! -f app/build/outputs/bundle/release/app-release.aab ]; then
            echo "::error::Signed release bundle app-release.aab not found."
            exit 1
          fi
          cp app/build/outputs/bundle/release/app-release.aab "dist/regimen-${VER}.aab"

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: regimen-${{ steps.version.outputs.tag_name }}-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          name: "Regimen ${{ steps.version.outputs.tag_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag_name, '-') }}
          files: dist/*
