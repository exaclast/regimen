name: Android CI & Signed Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-debug:
    name: Unit Tests & Debug APK
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: regimen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-and-release:
    name: Signed Release APK, AAB & GitHub Release
    if: "startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute Version Metadata
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
            VER_NAME="${RAW_TAG#v}"
          else
            VER_NAME="${{ inputs.version_name || '1.0.0' }}"
            RAW_TAG="v${VER_NAME}"
          fi
          echo "version_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Decode Signing Keystore
        if: "${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}"
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"

      - name: Run Unit Tests & Build Release Artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || 'regimen' }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease bundleRelease

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          VER="${{ steps.version.outputs.version_name }}"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/regimen-${VER}.apk"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/regimen-${VER}-unsigned.apk"
          fi
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/regimen-${VER}.aab"
          fi

      - name: Upload Release Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: regimen-${{ steps.version.outputs.tag_name }}-artifacts
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: "startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          name: "Regimen ${{ steps.version.outputs.tag_name }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag_name, '-') }}
          files: dist/*

